    <main>

        <section class="intro">
            <h1 class="welcome-text">GALLERY</h1>
            <p>Ten sacred places of Ethiopia, in pictures.</p>
        </section>

        <section class="gallery">

            <figure id="lalibela">
                <img src="image/lalibela.jpg" alt="Rock-hewn church of Lalibela">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Lalibela</h2>
                    <p>Churches carved down into the rock and linked by trenches and tunnels. Bete Giyorgis is shaped like a cross.</p>
                </figcaption>
            </figure>

            <figure id="axum">
                <img src="image/zion.jpg" alt="Our Lady Mary of Zion church in Axum">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Axum</h2>
                    <p>Home of Our Lady Mary of Zion. Pilgrims gather every year for the Hidar Zion festival in November.</p>
                </figcaption>
            </figure>

            <figure id="debre-damo">
                <img src="image/debre damo.jpg" alt="Debre Damo monastery on its cliff">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Debre Damo</h2>
                    <p>A monastery on a flat-topped mountain with sheer cliffs. The only way up is a rope.</p>
                </figcaption>
            </figure>

            <figure id="yeha">
                <img src="image/yeha.jpg" alt="The ancient temple of Yeha">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Yeha</h2>
                    <p>A temple of finely cut stone, among the oldest standing buildings in Ethiopia.</p>
                </figcaption>
            </figure>

            <figure id="yemata-guh">
                <img src="image/abune yemata.jpg" alt="Abuna Yemata Guh cliff church">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Abuna Yemata Guh</h2>
                    <p>A church inside a cliff face in the Gheralta mountains, reached by a steep climb.</p>
                </figcaption>
            </figure>

            <figure id="lake-tana">
                <img src="image/lake_tana.jpg" alt="Monastery on Lake Tana">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Lake Tana</h2>
                    <p>Monasteries on islands and peninsulas, with walls covered in bright paintings.</p>
                </figcaption>
            </figure>

            <figure id="debre-berhan">
                <img src="image/debrebirhan.jpg" alt="Painted ceiling of Debre Berhan Selassie">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Debre Berhan Selassie</h2>
                    <p>A Gondar church whose ceiling is covered with painted angel faces.</p>
                </figcaption>
            </figure>

            <figure id="debre-libanos">
                <img src="image/libanos.jpg" alt="Debre Libanos monastery">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Debre Libanos</h2>
                    <p>A major pilgrimage site honoring Abune Tekle Haymanot, set above a deep gorge.</p>
                </figcaption>
            </figure>

            <figure id="gishen-mariam">
                <img src="image/gishen.jpg" alt="Gishen Mariam monastery">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Gishen Mariam</h2>
                    <p>A monastery on a high mountain in Wollo, visited by pilgrims who honor its cross relic.</p>
                </figcaption>
            </figure>

            <figure id="entoto-maryam">
                <img src="image/entoto.jpg" alt="Entoto Maryam church">
                <figcaption>
                    <h2><i class="fa-solid fa-church"></i> Entoto Maryam</h2>
                    <p>A church high on Mount Entoto above Addis Ababa, near the old palace of Menelik II.</p>
                </figcaption>
            </figure>

        </section>
